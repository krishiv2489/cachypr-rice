# === FONT CONFIGURATION ===
font_family      JetBrainsMono Nerd Font 
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
disable_ligatures never

# === CURSOR & MOUSE ===
cursor_shape          block
cursor_trail          1
cursor_trail_decay    0.1 0.4
mouse_hide_wait       3.0

# === URL HANDLING ===
url_color             #0087bd
url_style             curly 
open_url_with         default

# === PERFORMANCE & SYSTEMS ===
sync_to_monitor       yes
repaint_delay         8
input_delay           3
scrollback_lines      10000

# === AUDIO / BELL ===
enable_audio_bell     no

# === WINDOW LAYOUT & STYLE ===
remember_window_size      no
initial_window_width      640
initial_window_height     400 
remember_window_position  no

# Padding around terminal edges
window_padding_width      15

# Smooth out window resizing steps on tiling structures
resize_debounce_time      0.1
