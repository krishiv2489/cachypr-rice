[config]

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland-colors.lua'
output_path = '~/.config/hypr/modules/colors.lua'
post_hook = 'hyprctl reload'

[templates.waybar]
input_path = '~/.config/matugen/templates/waybar-colors.css'
output_path = '~/.config/waybar/colors/colors.css'

[templates.rofi]
input_path = "templates/rofi-colors.rasi"
output_path = "~/.config/rofi/colors/colors.rasi"